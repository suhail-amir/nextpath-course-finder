<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextPath Career Compass</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}
.container{width:100%;max-width:520px}
.header{background:#1a56db;border-radius:16px 16px 0 0;padding:20px 20px 16px;text-align:center}
.header img{height:42px;filter:brightness(0) invert(1);margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}
.header h1{font-size:18px;color:#fff;margin-bottom:3px}
.header p{font-size:13px;color:rgba(255,255,255,0.85)}
.progress-bar{background:#1a56db;padding:10px 20px}
.progress-track{background:rgba(255,255,255,0.3);border-radius:10px;height:5px;overflow:hidden}
.progress-fill{background:white;height:100%;border-radius:10px;transition:width .4s ease}
.progress-text{color:rgba(255,255,255,0.85);font-size:12px;margin-top:5px}
.section-label{background:#1648c0;color:rgba(255,255,255,0.9);padding:7px 20px 14px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.card{background:white;border-radius:0 0 16px 16px;padding:22px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.question{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:5px;line-height:1.4}
.question-sub{font-size:13px;color:#6b7280;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:9px}
.option{border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:11px}
.option:hover,.option.selected{border-color:#1a56db;background:#eff6ff}
.option-icon{width:34px;height:34px;border-radius:9px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.option.selected .option-icon{background:#dbeafe}
.option-text{font-size:14px;color:#374151;line-height:1.4;font-weight:500}
.option-sub{font-size:12px;color:#9ca3af;margin-top:2px;font-weight:400}
.text-input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:14px;color:#374151;outline:none;background:white}
.text-input:focus{border-color:#1a56db}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn-back{background:#f3f4f6;color:#6b7280;flex:.35}
.btn-next{background:#1a56db;color:white}
.error{color:#dc2626;font-size:12px;margin-top:8px;display:none}
.form-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;display:block}
.form-label span{color:#dc2626}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.course-btn{border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;font-size:12px;font-weight:500;color:#374151;background:white;line-height:1.3;position:relative}
.course-btn:hover,.course-btn.selected{border-color:#1a56db;background:#eff6ff;color:#1a56db}
.course-btn.selected{font-weight:700}
.course-btn.selected::after{content:"\2713";position:absolute;top:4px;right:6px;font-size:10px}
.course-btn-other{grid-column:1/-1}
.selected-count{font-size:12px;color:#1a56db;font-weight:600;margin-top:8px}
.result-header{text-align:center;margin-bottom:14px}
.result-logo{height:30px;margin-bottom:10px}
.result-header h2{font-size:19px;font-weight:700;color:#1a1a2e;margin-bottom:5px}
.result-header p{font-size:13px;color:#6b7280}
.student-summary{background:#f8faff;border:1.5px solid #dbeafe;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.student-name{font-size:15px;font-weight:700;color:#1a56db;margin-bottom:3px}
.student-sub{font-size:12px;color:#6b7280}
.stream-note{background:#fff8e1;border:1.5px solid #ffd54f;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#7b5800;line-height:1.5}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#1648c0;margin:18px 0 8px}
.course-card{border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
.course-card.top{border-color:#1a56db;background:#f5f9ff}
.badge{background:#1a56db;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:7px}
.course-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.course-yrs{font-size:12px;color:#6b7280;margin-bottom:6px}
.why{font-size:13px;color:#4b5563;line-height:1.5;margin-bottom:8px}
.why div{margin:2px 0}
.fit{font-size:12px;line-height:1.45;margin:8px 0;padding:8px 10px;background:#f9fafb;border-radius:8px}
.fit div{margin:2px 0}
.good{color:#166534}.warn{color:#92400e}.bad{color:#b91c1c}
.risk{margin-top:8px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px 10px}
.risk-h{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#4b5563;margin-bottom:5px}
.ev{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.ev-s{background:#dcfce7;color:#166534}.ev-m{background:#fef9c3;color:#854d0e}.ev-e{background:#f3f4f6;color:#4b5563}
.rb{margin:4px 0}.rl{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;font-weight:600;margin-bottom:2px}.rl b{color:#111}
.rk{height:8px;background:#e5e7eb;border-radius:8px;position:relative;overflow:hidden}.rf{position:absolute;top:0;bottom:0;border-radius:8px}
.ra{background:linear-gradient(90deg,#f97316,#ef4444)}.rg{background:linear-gradient(90deg,#22c55e,#4ade80)}
.rr{font-size:12px;color:#4b5563;line-height:1.45;margin-top:6px}
.npb{font-size:12px;font-weight:700;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:6px 9px;margin:6px 0}.dbtn{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:#1a56db;text-decoration:none;border:1.5px solid #1a56db;border-radius:8px;padding:5px 10px}
.bk{margin-top:10px;border-top:1px dashed #cbd5e1;padding-top:8px}
.bk-t{font-size:12px;font-weight:700;color:#1648c0;margin-bottom:4px}
.bk-i{font-size:12px;color:#374151;margin:6px 0;line-height:1.45}
.bk-i b{color:#111}.bk-i a{color:#1a56db;font-weight:600;text-decoration:none}
.pick{border:1.5px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:10px;background:#fffdf5}
.info-box{border-radius:12px;padding:12px 14px;margin:10px 0}
.info-green{background:#f0fdf4;border:1.5px solid #86efac;font-size:13px;color:#166534}
.info-note{background:#fff7ed;border:1px solid #fed7aa;font-size:12px;color:#7c2d12;line-height:1.5}
.wa-btn{width:100%;background:#25d366;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none}
.restart-btn{width:100%;background:#f3f4f6;color:#6b7280;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.save-msg{text-align:center;font-size:12px;color:#6b7280;margin-top:10px}
.foot{font-size:11px;color:#9ca3af;text-align:center;margin-top:12px;line-height:1.5}
.foot a{color:#1a56db}
</style>
</head>

const PICK=[["MBBS / BDS","mbbs-and-bds-clinical-practice"],["BAMS (Ayurveda)","bams-ayurveda"],["B.Sc Nursing","nursing"],["BPT (Physiotherapy)","physiotherapy-bpt"],["B.Pharm","pharmacy-b-pharm"],["Lab / Radiography","lab-radiography-and-imaging-technology"],["Optometry","optometry"],["Nutrition & Dietetics","nutrition-dietetics"],["B.Tech CSE","computer-science-engineering-b-tech-cse-it"],["B.Tech Mechanical","mechanical-engineering"],["B.Tech Civil","civil-engineering-and-construction"],["B.Tech ECE / EEE","electronics-communication-engineering-ece"],["BCA","bca-bachelor-of-computer-applications"],["B.Sc Computer Science","bsc-computer-science"],["Data Science / AI","data-science-and-ai-ml"],["Cybersecurity","cybersecurity-and-cloud-security"],["BBA","bba-general"],["BCom","bcom-finance-and-taxation"],["CA","ca-chartered-accountancy"],["BA LLB (Law)","ba-llb-integrated"],["B.Des (Design)","b-des-bachelor-of-design"],["Fashion Design","fashion-design-nift-and-others"],["Animation / VFX","animation-and-vfx"],["Mass Communication","mass-communication-ba-bsc"],["Hotel Management","hotel-management-bhm-bsc-hospitality"],["Merchant Navy","nautical-science-dns-b-sc-nautical-science"],["Pilot / Aviation","commercial-pilot-training-cpl"],["B.Sc Psychology","psychology-ba-bsc-general"],["Teaching (B.Ed / ITEP)","integrated-b-ed-itep-4-years-after-12th"],["B.Sc Agriculture","bsc-agriculture-hons"],["B.Sc Biotechnology","bsc-biotechnology"]];
const CBY=id=>COURSES.find(c=>c.id===id);
function genRef(){const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";let r="NP-";for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}
function prog(){return Math.round(((step+1)/(questions.length+1))*100);}
function renderForm(){
 pFill.style.width="5%";pText.textContent="Step 1 of "+(questions.length+1);secLabel.textContent="Your Details";
 quizArea.innerHTML=`<div class="question">Let us start with your details</div><div class="question-sub">So we can follow up and personalise your counseling session</div>
 <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
 <div><label class="form-label">Your Name <span>*</span></label><input class="text-input" id="iName" placeholder="Enter your full name" value="${user.name}"></div>
 <div><label class="form-label">WhatsApp Number <span>*</span></label><input class="text-input" id="iPhone" type="tel" placeholder="+91 or 10-digit number" value="${user.phone}"></div>
 <div><label class="form-label">Your Location</label><div style="display:flex;gap:8px"><input class="text-input" id="iState" placeholder="State" value="${user.state}" style="flex:1"><input class="text-input" id="iDistrict" placeholder="Enter your district" value="${user.district}" style="flex:1.4"></div><div style="font-size:11px;color:#9ca3af;margin-top:4px">State defaults to Kerala. Change if you are from another state.</div></div></div>
 <div class="error" id="fErr">Please enter your name and WhatsApp number</div>
 <div class="nav"><button class="btn btn-next" onclick="submitForm()">Start →</button></div>`;
 resultArea.style.display="none";quizArea.style.display="block";}
function submitForm(){const n=iName.value.trim(),p=iPhone.value.trim();if(!n||!p){fErr.style.display="block";return;}
 user={name:n,phone:p,state:iState.value.trim()||"Kerala",district:iDistrict.value.trim()};step=1;renderQ();}
function renderQ(){const qi=step-1,q=questions[qi];
 pFill.style.width=prog()+"%";pText.textContent="Step "+(step+1)+" of "+(questions.length+1);secLabel.textContent=q.sec;
 let h=`<div class="question">${q.q}</div>`;if(q.sub)h+=`<div class="question-sub">${q.sub}</div>`;
 if(q.type==="options"){h+='<div class="options">';q.opts.forEach((o,i)=>{h+=`<div class="option ${ans[qi]===o.v?"selected":""}" onclick="selOpt(${i})"><div class="option-icon">${o.i}</div><div><div class="option-text">${o.t}</div>${o.s?`<div class="option-sub">${o.s}</div>`:""}</div></div>`;});h+='</div><div class="error" id="qErr">Please select an option to continue</div>';}
 else{const sel=ans[qi]||[];h+='<div class="course-grid">';PICK.forEach((c,i)=>{h+=`<button class="course-btn ${sel.includes(c[0])?"selected":""}" onclick="toggleCourse(${i},this)">${c[0]}</button>`;});
 h+=`<button class="course-btn course-btn-other" onclick="showOther(this)">✏️ Other course</button></div><div id="otherDiv" style="display:none;margin-top:10px"><input class="text-input" id="otherInp" placeholder="Type your course name..." oninput="addOther(this.value)"></div><div class="selected-count" id="selCount">${sel.length?sel.length+" selected":"Tap any course to select"}</div>`;}
 h+=`<div class="nav"><button class="btn btn-back" onclick="goBack()">←</button><button class="btn btn-next" onclick="goNext()">${qi===questions.length-1?"See My Results →":"Next →"}</button></div>`;
 quizArea.innerHTML=h;resultArea.style.display="none";quizArea.style.display="block";}
function selOpt(i){const qi=step-1;ans[qi]=questions[qi].opts[i].v;document.querySelectorAll(".option").forEach((el,idx)=>el.classList.toggle("selected",idx===i));const e=document.getElementById("qErr");if(e)e.style.display="none";}
function toggleCourse(i,btn){const qi=step-1;if(!ans[qi])ans[qi]=[];const n=PICK[i][0],k=ans[qi].indexOf(n);if(k>-1){ans[qi].splice(k,1);btn.classList.remove("selected");}else{ans[qi].push(n);btn.classList.add("selected");}selCount.textContent=ans[qi].length?ans[qi].length+" selected":"Tap any course to select";}
function showOther(btn){otherDiv.style.display=otherDiv.style.display==="none"?"block":"none";if(otherDiv.style.display==="block")otherInp.focus();btn.classList.toggle("selected");}
function addOther(v){const qi=step-1;ans[qi]=(ans[qi]||[]).filter(c=>!c.startsWith("__other__"));if(v.trim())ans[qi].push("__other__"+v.trim());}
function goNext(){const qi=step-1,q=questions[qi];if(q.type==="options"&&!ans[qi]){qErr.style.display="block";return;}if(step<questions.length){step++;renderQ();}else showResult();}
function goBack(){if(step>1){step--;renderQ();}else{step=0;renderForm();}}

function riskBlock(c){const e={S:["Strong evidence","s"],M:["Moderate evidence","m"],E:["Our estimate","e"]}[c.c];
 const bar=(l,a,k)=>`<div class="rb"><div class="rl"><span>${l}</span><b>${a[0]}-${a[1]}%</b></div><div class="rk"><div class="rf ${k}" style="left:${a[0]}%;width:${a[1]-a[0]}%"></div></div></div>`;
 let reason=c.note||("AI is strongest at: "+c.t+".");if(reason.length>190)reason=reason.slice(0,reason.lastIndexOf(" ",187))+"...";
 return `<div class="risk"><div class="risk-h"><span>AI RISK (estimate)</span><span class="ev ev-${e[1]}">${e[0]}</span></div>${bar("If you ignore AI",c.r,"ra")}${bar("If you learn AI in this field",c.a,"rg")}<div class="rr">${reason}</div><a class="dbtn" href="ai-risk.html#${c.id}" target="_blank">See full details →</a></div>`;}
function fitHtml(r,u){return '<div class="fit">'+fitLines(r,u).map(l=>`<div class="${l.t}">${l.t==="good"?"✓":l.t==="warn"?"!":"✕"} ${l.x}</div>`).join("")+'</div>';}
function money(r){return ["","under 50,000","50,000 to 2 lakh","2 to 5 lakh","above 5 lakh"][r.m.b[1]];}
function cardHtml(r,i,u,all,used){const c=r.c;
 let h=`<div class="course-card ${i===0?"top":""}">${i===0?'<span class="badge">⭐ Best Match</span>':'<span class="badge" style="background:#64748b">Match '+(i+1)+'</span>'}<div class="course-name">${c.n}</div><div class="course-yrs">${c.y?c.y+" • ":""}Typical yearly cost: ${money(r)}${c.fee?" • Fees: "+c.fee:""}</div>${c.na?`<div class="npb">✓ NextPath handles admission for this course${c.np?". Partner colleges: "+c.np:""}</div>`:""}`;
 const why=r.why.slice(0,3);h+=`<div class="why">${(why.length?why:["Open to your stream and within reach of your marks"]).map(x=>`<div>• ${x}</div>`).join("")}</div>`;
 h+=fitHtml(r,u)+riskBlock(c);
 const bk=backupsFor(r,all,used,2);
 if(bk.length){h+=`<div class="bk"><div class="bk-t">If this does not work out, consider:</div>`+bk.map(b=>`<div class="bk-i"><b>${b.c.n}</b> <span style="color:#6b7280">(AI risk with skills ${b.c.a[0]}-${b.c.a[1]}%)</span><br>${b.flags.govtOnly?"Mainly government or aided seats. ":"Fits your budget. "}${b.gap>0?"Competitive for your marks. ":"Realistic for your marks. "}<a href="ai-risk.html#${b.c.id}" target="_blank">Details</a></div>`).join("")+`</div>`;}
 return h+"</div>";}
function pickHtml(label,id,u,all){const c=CBY(id);if(!c)return "";const r=scoreCourse(c,u);if(!r)return "";
 let h=`<div class="pick"><div class="course-name">${c.n}</div><div class="course-yrs">You selected: ${label}</div>${fitHtml(r,u)}${riskBlock(c)}`;
 if(!r.hard||r.soft.length||r.flags.marks1){const bk=backupsFor(r,all,new Set(),3);if(bk.length)h+=`<div class="bk"><div class="bk-t">Safer options in the same area:</div>`+bk.map(b=>`<div class="bk-i"><b>${b.c.n}</b> <a href="ai-risk.html#${b.c.id}" target="_blank">Details</a></div>`).join("")+`</div>`;}
 return h+"</div>";}
function showResult(){refId=genRef();pFill.style.width="100%";pText.textContent="Your results are ready!";secLabel.textContent="Your Results";quizArea.style.display="none";
 const {u,all}=scoreAll(ans);const top=pickTop(all,3);const used=new Set(top.map(r=>r.c.id));
 const sel=(ans[12]||[]),loc=user.district?user.district+", "+user.state:user.state;
 const notes={stream_forced:"Your results are based on your personality. Your stream was a circumstance. Your career should be your choice. Only courses open to your stream are shown.",stream_lost:"Since you are open to anything, we matched courses to who you are, within what your stream allows.",stream_mixed:"We balanced your stream background with your personality.",stream_love:""};
 const wm={fees:"Budget is a real concern. NextPath knows affordable government and aided options most students miss on their own.",jobs:"We weighted AI risk and job demand more heavily for you. Your counselor will show real placement data from colleges.",parents:"Parent conversations about courses can be tough. Our counselors have helped many families reach a decision everyone accepts.",wrong_choice:"That is exactly why every result comes with backup options. A personalised session removes the guesswork."};
 let h=`<div class="result-header"><img src="${LOGO}" class="result-logo" alt="NextPath EduCare"><h2>Your Career Compass 🧭</h2><p>Based on your personality, stream, marks, budget and entrance plans</p></div>`;
 h+=`<div class="student-summary"><div class="student-name">👋 ${user.name}</div><div class="student-sub">${loc} • Ref: ${refId}</div></div>`;
 if(notes[ans[6]])h+=`<div class="stream-note">💡 ${notes[ans[6]]}</div>`;
 h+='<div class="sec-title">Your top matches</div>';
 if(!top.length)h+='<div class="info-box info-note">We could not find a strong match with these answers. Please talk to a NextPath counselor for a personal review.</div>';
 top.forEach((r,i)=>{h+=cardHtml(r,i,u,all,used);});
 const picks=sel.filter(x=>!x.startsWith("__other__")).map(l=>PICK.find(p=>p[0]===l)).filter(Boolean);
 const others=sel.filter(x=>x.startsWith("__other__")).map(x=>x.slice(9));
 if(picks.length||others.length){h+='<div class="sec-title">Your own picks, checked honestly</div>';picks.forEach(p=>{h+=pickHtml(p[0],p[1],u,all);});
  if(others.length)h+=`<div class="info-box info-note">Also mentioned: ${others.join(", ")}. Your counselor will check these with you.</div>`;}
 if(wm[ans[13]])h+=`<div class="info-box info-green">💬 ${wm[ans[13]]}</div>`;
 h+=`<div class="info-box info-note"><b>About the AI numbers:</b> these are estimates built from research direction and our own judgment, not predictions. They show how much entry-level work AI may absorb by about 2035. Report version ${REPORT.version}, dated ${REPORT.date}. <a href="ai-risk.html" target="_blank">Open the full AI Career Risk Report</a></div>`;
 const recs=top.map(r=>r.c.n),bks=[];top.forEach(r=>{});
 const waMsg=encodeURIComponent("Hi NextPath! My Career Compass reference ID is "+refId+". I am "+user.name+" from "+loc+". My top match was "+(recs[0]||"not clear")+". I would like personalised guidance.");
 h+=`<a class="wa-btn" href="https://wa.me/918590361125?text=${waMsg}" target="_blank"><span>💬 Talk to a NextPath Counselor</span><span style="font-size:13px;font-weight:400;opacity:.9">+91 85903 61125</span></a><div class="save-msg" id="saveMsg">📤 Saving your results...</div><button class="restart-btn" onclick="restart()">↺ Start Again</button><div class="foot">NextPath Career Compass v${QUIZ_VERSION}. College names and fees are guidance. Always verify seats, approval and fees with the college.</div>`;
 resultArea.innerHTML=h;resultArea.style.display="block";window.scrollTo(0,0);
 const used2=new Set(top.map(r=>r.c.id));const backupNames=top.map(r=>backupsFor(r,all,used2,2).map(b=>b.c.n).join(" / "));
 saveData(top,backupNames,sel.map(x=>x.startsWith("__other__")?x.slice(9):x).join(", "),loc);}
function saveData(top,backupNames,selected,loc){
 const SL={P:"Science (PCB)",X:"Science (PCMB)",M:"Science (PCM)",C:"Commerce",H:"Humanities"},CL={stream_love:"Genuinely enjoyed",stream_forced:"Forced/Circumstance",stream_mixed:"Mixed feelings",stream_lost:"No idea/Open"},ML={high:"Above 85%",medium:"70-85%",low:"55-70%",very_low:"Below 55%"},BL={budget_low:"Under 50k/yr",budget_mid:"50k-2L/yr",budget_high:"2L-5L/yr",budget_premium:"Above 5L/yr"},LL={kerala:"Only Kerala",south:"South India",india:"Anywhere India",abroad:"Open to Abroad"},EXL={N:"NEET",E:"KEAM/JEE",O:"CLAT/NATA/UCEED/NIFT/CUET",none:"None"},WL={fees:"Fees/Budget",jobs:"Job prospects",parents:"Parent approval",wrong_choice:"Fear of wrong choice"},CSL={yes_course:"Has course in mind",confused:"Confused between options",no_idea:"No idea yet",conflict:"Parent-student conflict"};
 const now=new Date();
 const payload={refId:refId,time:now.toLocaleDateString("en-IN")+", "+now.toLocaleTimeString("en-IN"),name:user.name,phone:user.phone,location:loc,q1:ans[0]||"",q2:ans[1]||"",q3:ans[2]||"",q4:ans[3]||"",q5:ans[4]||"",stream:SL[ans[5]]||"",streamComfort:CL[ans[6]]||"",marks:ML[ans[7]]||"",budget:BL[ans[8]]||"",locationPref:LL[ans[9]]||"",entrance:EXL[ans[10]]||"",courseStatus:CSL[ans[11]]||"",coursesInMind:selected||"None",worry:WL[ans[13]]||"",result1:top[0]?top[0].c.n:"",result2:top[1]?top[1].c.n:"",result3:top[2]?top[2].c.n:"",backups:backupNames.join(" | "),quizVersion:QUIZ_VERSION,reportVersion:REPORT.version};
 fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(()=>{saveMsg.textContent="✅ Saved. Share Reference ID "+refId+" with your counselor.";}).catch(()=>{saveMsg.textContent="✅ Complete. Reference ID: "+refId;});}
function restart(){user={name:"",phone:"",state:"Kerala",district:""};ans={};step=0;refId="";renderForm();}
renderForm();
</script>
