<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextPath Course Finder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}
.container{width:100%;max-width:500px}
.header{background:#1a56db;border-radius:16px 16px 0 0;padding:20px 20px 16px;text-align:center}
.header img{height:42px;filter:brightness(0) invert(1);margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}
.header p{font-size:13px;color:rgba(255,255,255,0.85)}
.progress-bar{background:#1a56db;padding:10px 20px}
.progress-track{background:rgba(255,255,255,0.3);border-radius:10px;height:5px;overflow:hidden}
.progress-fill{background:white;height:100%;border-radius:10px;transition:width 0.4s ease}
.progress-text{color:rgba(255,255,255,0.85);font-size:12px;margin-top:5px}
.section-label{background:#1648c0;color:rgba(255,255,255,0.9);padding:7px 20px 14px;font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}
.card{background:white;border-radius:0 0 16px 16px;padding:22px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.question{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:5px;line-height:1.4}
.question-sub{font-size:13px;color:#6b7280;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:9px}
.option{border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:11px}
.option:hover,.option.selected{border-color:#1a56db;background:#eff6ff}
.option-icon{width:34px;height:34px;border-radius:9px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.option.selected .option-icon{background:#dbeafe}
.option-text{font-size:14px;color:#374151;line-height:1.4;font-weight:500}
.option-sub{font-size:12px;color:#9ca3af;margin-top:2px;font-weight:400}
.text-input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:14px;color:#374151;outline:none;transition:border-color 0.2s;background:white}
.text-input:focus{border-color:#1a56db}
.text-input::placeholder{color:#c4c9d4}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-back{background:#f3f4f6;color:#6b7280;flex:0.35}
.btn-next{background:#1a56db;color:white}
.btn-next:hover{background:#1648c0}
.error{color:#dc2626;font-size:12px;margin-top:8px;display:none}
.form-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;display:block}
.form-label span{color:#dc2626}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.course-btn{border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;font-size:12px;font-weight:500;color:#374151;background:white;transition:all 0.2s;line-height:1.3;position:relative}
.course-btn:hover{border-color:#1a56db;background:#eff6ff;color:#1a56db}
.course-btn.selected{border-color:#1a56db;background:#eff6ff;color:#1a56db;font-weight:700}
.course-btn.selected::after{content:"✓";position:absolute;top:4px;right:6px;font-size:10px;color:#1a56db;font-weight:700}
.course-btn-other{grid-column:1 / -1}
.selected-count{font-size:12px;color:#1a56db;font-weight:600;margin-top:8px}
.result-header{text-align:center;margin-bottom:16px}
.result-logo{height:30px;margin-bottom:10px}
.result-header h2{font-size:19px;font-weight:700;color:#1a1a2e;margin-bottom:5px}
.result-header p{font-size:13px;color:#6b7280}
.student-summary{background:#f8faff;border:1.5px solid #dbeafe;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.student-name{font-size:15px;font-weight:700;color:#1a56db;margin-bottom:3px}
.student-sub{font-size:12px;color:#6b7280}
.stream-note{background:#fff8e1;border:1.5px solid #ffd54f;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#7b5800;line-height:1.5}
.course-card{border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px}
.course-card.top{border-color:#1a56db;background:#eff6ff}
.badge{background:#1a56db;color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:7px}
.course-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.course-why{font-size:13px;color:#4b5563;line-height:1.5;margin-bottom:8px}
.course-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#f3f4f6;color:#6b7280;font-size:11px;padding:3px 9px;border-radius:20px}
.course-card.top .tag{background:#dbeafe;color:#1a56db}
.info-box{border-radius:12px;padding:12px 14px;margin-bottom:10px}
.info-yellow{background:#fef3c7;border:1.5px solid #fcd34d}
.info-green{background:#f0fdf4;border:1.5px solid #86efac}
.wa-btn{width:100%;background:#25d366;color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none}
.wa-btn:hover{background:#1db954}
.restart-btn{width:100%;background:#f3f4f6;color:#6b7280;border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.save-msg{text-align:center;font-size:12px;color:#6b7280;margin-top:10px}
.mention-courses{background:#f0f7ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.mention-title{font-size:12px;font-weight:700;color:#1e40af;margin-bottom:6px}
.mention-tags{display:flex;flex-wrap:wrap;gap:5px}
.mention-tag{background:#dbeafe;color:#1a56db;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
</style>
</head>

    <div class="question-sub">So we can follow up and personalise your counseling session</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
      <div>
        <label class="form-label">Your Name <span>*</span></label>
        <input class="text-input" id="iName" placeholder="Enter your full name" value="${user.name}">
      </div>
      <div>
        <label class="form-label">WhatsApp Number <span>*</span></label>
        <input class="text-input" id="iPhone" type="tel" placeholder="+91 or 10-digit number" value="${user.phone}">
      </div>
      <div>
        <label class="form-label">Your Location</label>
        <div style="display:flex;gap:8px">
          <input class="text-input" id="iState" placeholder="State" value="${user.state}" style="flex:1">
          <input class="text-input" id="iDistrict" placeholder="Enter your district" value="${user.district}" style="flex:1.4">
        </div>
        <div style="font-size:11px;color:#9ca3af;margin-top:4px">State defaults to Kerala. Change if you are from another state.</div>
      </div>
    </div>
    <div class="error" id="fErr">Please enter your name and WhatsApp number</div>
    <div class="nav"><button class="btn btn-next" onclick="submitForm()" style="flex:1">Start Quiz →</button></div>`;
  document.getElementById("resultArea").style.display="none";
  document.getElementById("quizArea").style.display="block";
}

function submitForm(){
  const n=document.getElementById("iName").value.trim();
  const p=document.getElementById("iPhone").value.trim();
  if(!n||!p){document.getElementById("fErr").style.display="block";return;}
  user={name:n,phone:p,state:document.getElementById("iState").value.trim()||"Kerala",district:document.getElementById("iDistrict").value.trim()};
  step=1;renderQ();
}

function renderQ(){
  const qi=step-1;
  const q=questions[qi];
  document.getElementById("pFill").style.width=prog()+"%";
  document.getElementById("pText").textContent="Step "+(step+1)+" of "+(questions.length+1);
  document.getElementById("secLabel").textContent=q.sec;
  let h=`<div class="question">${q.q}</div>`;
  if(q.sub)h+=`<div class="question-sub">${q.sub}</div>`;

  if(q.type==="options"){
    h+='<div class="options">';
    q.opts.forEach((o,i)=>{
      const s=ans[qi]===o.v?"selected":"";
      h+=`<div class="option ${s}" onclick="selOpt(${i})"><div class="option-icon">${o.i}</div><div><div class="option-text">${o.t}</div>${o.s?`<div class="option-sub">${o.s}</div>`:""}</div></div>`;
    });
    h+='</div><div class="error" id="qErr">Please select an option to continue</div>';
  } else if(q.type==="course_select"){
    const sel=ans[qi]||[];
    h+='<div class="course-grid" id="cgrid">';
    allCourses.forEach((c,i)=>{
      const s=sel.includes(c)?"selected":"";
      h+=`<button class="course-btn ${s}" onclick="toggleCourse('${c.replace(/'/g,"\'")}',this)">${c}</button>`;
    });
    h+=`<button class="course-btn course-btn-other" onclick="showOther(this)">✏️ Other course</button>`;
    h+='</div>';
    h+=`<div id="otherDiv" style="display:none;margin-top:10px"><input class="text-input" id="otherInp" placeholder="Type your course name..." oninput="addOther(this.value)"></div>`;
    const cnt=sel.length;
    h+=`<div class="selected-count" id="selCount">${cnt>0?cnt+" course"+(cnt>1?"s":"")+" selected — tap more to add or deselect to remove":"Tap any course to select — choose as many as you want"}</div>`;
    if(q.optional)h+=`<div style="font-size:12px;color:#9ca3af;margin-top:6px">Optional — skip if unsure</div>`;
  }

  h+=`<div class="nav"><button class="btn btn-back" onclick="goBack()">←</button><button class="btn btn-next" onclick="goNext()">${qi===questions.length-1?"See My Results →":"Next →"}</button></div>`;
  document.getElementById("quizArea").innerHTML=h;
  document.getElementById("resultArea").style.display="none";
  document.getElementById("quizArea").style.display="block";
}

function selOpt(i){
  const qi=step-1;
  ans[qi]=questions[qi].opts[i].v;
  document.querySelectorAll(".option").forEach((el,idx)=>el.classList.toggle("selected",idx===i));
  const e=document.getElementById("qErr");if(e)e.style.display="none";
}

function toggleCourse(c,btn){
  const qi=step-1;
  if(!ans[qi])ans[qi]=[];
  const idx=ans[qi].indexOf(c);
  if(idx>-1){ans[qi].splice(idx,1);btn.classList.remove("selected");}
  else{ans[qi].push(c);btn.classList.add("selected");}
  const cnt=ans[qi].length;
  const sc=document.getElementById("selCount");
  if(sc)sc.textContent=cnt>0?cnt+" course"+(cnt>1?"s":"")+" selected — tap more to add or deselect to remove":"Tap any course to select — choose as many as you want";
}

function showOther(btn){
  const d=document.getElementById("otherDiv");
  if(d){d.style.display=d.style.display==="none"?"block":"none";if(d.style.display==="block")document.getElementById("otherInp").focus();}
  btn.classList.toggle("selected");
}

function addOther(v){
  const qi=step-1;
  if(!ans[qi])ans[qi]=[];
  const filtered=ans[qi].filter(c=>!c.startsWith("__other__"));
  if(v.trim())filtered.push("__other__"+v.trim());
  ans[qi]=filtered;
}

function goNext(){
  const qi=step-1;
  const q=questions[qi];
  if(q.type==="options"&&!ans[qi]){document.getElementById("qErr").style.display="block";return;}
  if(step<questions.length){step++;renderQ();}
  else showResult();
}

function goBack(){
  if(step>1){step--;renderQ();}
  else{step=0;renderForm();}
}

function getCourses(){
  const p=[ans[0],ans[1],ans[2]].join(",");
  const sub=ans[3],vis=ans[4];
  const stream=ans[5];
  const streamComfort=ans[6];
  const mrk=ans[7],bud=ans[8];
  
  // KEY LOGIC: if stream was forced or student is lost, use personality only
  const ignoreStream=(streamComfort==="stream_forced"||streamComfort==="stream_lost");
  const mixedStream=(streamComfort==="stream_mixed");
  
  let c=[];

  // PERSONALITY-FIRST recommendations (always included regardless of stream)
  if(p.includes("tech")||sub==="math"||p.includes("analytical")){
    c.push({n:"BCA — Computer Applications",w:"Your analytical and tech-oriented personality is a strong fit for computing. BCA opens software development careers and government college options in Kerala are very affordable.",t:["Any stream","3 years","IT jobs","Govt colleges available"],score:9});
    if(mrk==="high"||mrk==="medium")c.push({n:"B.Sc Data Science",w:"The highest-demand tech course in 2026. Your love for logical thinking and problem-solving suits data science perfectly — high salary, multiple industries.",t:["Any stream","3 years","Highest demand 2026","Tech career"],score:8});
  }

  if(p.includes("business")||p.includes("organized")||vis==="financial"||vis==="achievement"){
    c.push({n:"BBA — Business Administration",w:"Your organized, business-minded personality suits management perfectly. Digital Marketing and Hospital Management specializations are the most in-demand tracks in 2026.",t:["Any stream","3 years","Management career","Entrepreneurship path"],score:8});
  }

  if(p.includes("creative")||vis==="freedom"){
    c.push({n:"B.Des — UI/UX or Communication Design",w:"Your creative personality is built for design. UI/UX designers are among the highest-paid professionals in tech companies — and you can work remotely.",t:["Any stream","4 years","High salary","Remote work possible"],score:7});
    c.push({n:"BA Journalism and Mass Communication",w:"For people who love language, storytelling and ideas. Digital media is booming in Kerala — content, video, journalism all growing fast.",t:["Any stream","3 years","Media career","Creative field"],score:7});
  }

  if(p.includes("social")||vis==="impact"){
    c.push({n:"B.Sc Psychology",w:"Your people-oriented personality makes psychology a natural fit. Rapidly growing post-2020 with careers in counseling, HR and research.",t:["Any stream","3 years","Growing demand","People-focused"],score:7});
    c.push({n:"BA LLB — Integrated Law",w:"Your communication skills and desire for impact suit law perfectly. Corporate law and human rights are both growing fields.",t:["CLAT exam","5 years","High earning","Any stream"],score:7});
  }

  // STREAM-SPECIFIC (only if student genuinely enjoyed their stream)
  if(!ignoreStream){
    if(stream==="science_bio"){
      if(p.includes("medical")||sub==="science"||vis==="impact"){
        if(mrk==="high"&&(bud==="budget_premium"||bud==="budget_high"))c.push({n:"MBBS",w:"Your Biology background, high marks and desire to help people make medicine a natural fit. Highest career ceiling in healthcare.",t:["NEET required","5.5 years","Highest earning","Kerala + Karnataka"],score:10});
        c.push({n:"B.Sc Nursing",w:"Kerala nurses are the most internationally sought healthcare professionals — Gulf, UK and Europe all have massive demand. Strong government college options.",t:["NEET required","4 years","International scope","Govt colleges"],score:9});
        c.push({n:"BPT — Physiotherapy",w:"No NEET required at most colleges. Direct patient care. Growing scope in hospitals, sports teams and private practice across India.",t:["No NEET at most","4.5 years","Own clinic possible","Growing field"],score:8});
      }
      if(mixedStream||p.includes("analytical")||sub==="math"){
        c.push({n:"B.Sc Biomedical / Biotechnology",w:"Perfect for PCB students who love science but want a technology-facing career rather than direct patient care.",t:["Science stream","3 years","Research career","Trending 2026"],score:7});
      }
    }

    if(stream==="science_math"){
      if(p.includes("tech")||sub==="math"){
        if(mrk==="high"||mrk==="medium")c.push({n:"B.Tech CSE / AI & ML",w:"PCM background plus analytical thinking equals engineering. CSE with AI/ML is the highest-demand and highest-salary engineering stream in 2026.",t:["JEE / KEAM","4 years","Highest IT salary","Many colleges"],score:10});
      }
    }

    if(stream==="commerce"){
      if(vis==="financial"||vis==="achievement")c.push({n:"CA Foundation — Chartered Accountancy",w:"Highest earning qualification for Commerce students. Tough but the salary after qualification is among the highest in India.",t:["Commerce stream","Alongside degree","Highest earning","Govt + private jobs"],score:9});
    }

    if(stream==="humanities"){
      if(p.includes("social"))c.push({n:"BA LLB — Integrated Law",w:"Humanities background and strong communication skills are exactly what law needs. Corporate and human rights both offer excellent careers.",t:["CLAT exam","5 years","High earning","Humanities"],score:9});
    }
  }

  // If stream was FORCED — add a helpful note course for their actual stream potential
  if(ignoreStream&&stream==="science_bio"){
    c.push({n:"BCA — Computer Applications",w:"Many PCB students who do not want medical careers find BCA is the perfect exit — strong IT career, no biology required, affordable government options in Kerala.",t:["PCB students can apply","3 years","IT career","No biology needed"],score:9});
    c.push({n:"BBA — Business Administration",w:"If you have a business or management mindset, your Plus 2 stream does not limit you at all. BBA is open to all streams.",t:["Any stream","3 years","Management","No stream barrier"],score:8});
  }

  if(ignoreStream&&stream==="science_math"){
    if(!p.includes("tech")&&!p.includes("analytical")){
      c.push({n:"BBA — Business Administration",w:"PCM does not mean you have to do engineering. If your personality points to business, management, or people — BBA is fully open to you.",t:["Any stream","3 years","Management","PCM students welcome"],score:8});
    }
  }

  // deduplicate by name
  const seen=new Set();
  c=c.filter(x=>{if(seen.has(x.n))return false;seen.add(x.n);return true;});
  
  // sort by score descending
  c.sort((a,b)=>b.score-a.score);

  if(c.length===0)c=[
    {n:"BCA — Computer Applications",w:"Versatile, high-demand degree open to all streams. Government college options in Kerala at very low fees.",t:["Any stream","3 years","IT jobs","Affordable"],score:8},
    {n:"BBA — Business Administration",w:"Strong all-rounder degree opening management, marketing and entrepreneurship paths across every industry.",t:["Any stream","3 years","Management","Flexible career"],score:7},
    {n:"B.Sc Psychology",w:"Rapidly growing field combining scientific thinking with understanding people.",t:["Any stream","3 years","Growing demand","People-focused"],score:6}
  ];

  return c.slice(0,3);
}

function showResult(){
  refId=genRef();
  document.getElementById("pFill").style.width="100%";
  document.getElementById("pText").textContent="Your results are ready!";
  document.getElementById("secLabel").textContent="Your Results";
  document.getElementById("quizArea").style.display="none";
  
  const recs=getCourses();
  const selectedCourses=ans[11]||[];
  const wr=ans[12];
  const streamComfort=ans[6];
  const stream=ans[5];
  const loc=user.district?user.district+", "+user.state:user.state;

  const wMsgs={
    fees:"Budget is a real concern — NextPath knows affordable government and aided options most students miss on their own.",
    jobs:"We only recommend courses with clear career paths. Your counselor will show you real placement data from colleges.",
    parents:"Parent conversations about courses can be tough. Our counselors have helped many families find a decision everyone is happy with.",
    wrong_choice:"That is exactly why NextPath exists. A personalised session removes the guesswork completely."
  };

  const streamNotes={
    stream_forced:"Your results are based on your personality — not your stream. Your stream was a circumstance. Your career should be your choice.",
    stream_lost:"Since you are open to anything, we matched courses to who you are — not what stream you studied.",
    stream_mixed:"We have balanced your stream background with your personality to find the best fit.",
    stream_love:""
  };

  let h=`<div class="result-header"><img src="${LOGO}" class="result-logo" alt="NextPath EduCare"><h2>Your Course Matches 🎯</h2><p>Based on your personality, situation and interests</p></div>`;
  h+=`<div class="student-summary"><div class="student-name">👋 ${user.name}</div><div class="student-sub">${loc} • Ref: ${refId}</div></div>`;

  if(streamComfort&&streamNotes[streamComfort])h+=`<div class="stream-note">💡 ${streamNotes[streamComfort]}</div>`;

  recs.forEach((c,i)=>{
    h+=`<div class="course-card ${i===0?"top":""}">${i===0?'<span class="badge">⭐ Best Match</span>':""}<div class="course-name">${c.n}</div><div class="course-why">${c.w}</div><div class="course-tags">${c.t.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>`;
  });

  if(selectedCourses.length>0){
    const cleanCourses=selectedCourses.map(c=>c.startsWith("__other__")?c.replace("__other__",""):c);
    h+=`<div class="mention-courses"><div class="mention-title">📝 Courses you mentioned — we will discuss these too:</div><div class="mention-tags">${cleanCourses.map(c=>`<span class="mention-tag">${c}</span>`).join("")}</div></div>`;
  }

  if(wr&&wMsgs[wr])h+=`<div class="info-box info-green"><div style="font-size:13px;color:#166534">💬 ${wMsgs[wr]}</div></div>`;

  const cleanSelected=selectedCourses.map(c=>c.startsWith("__other__")?c.replace("__other__",""):c).join(", ");
  const waMsg=encodeURIComponent("Hi NextPath! My quiz reference ID is "+refId+". I am "+user.name+" from "+loc+". My top match was "+recs[0].n+". I would like personalised guidance.");
  h+=`<a class="wa-btn" href="https://wa.me/918590361125?text=${waMsg}" target="_blank"><span>💬 Talk to a NextPath Counselor</span><span style="font-size:13px;font-weight:400;opacity:0.9">+91 85903 61125</span></a>`;
  h+=`<div class="save-msg" id="saveMsg">📤 Saving your results...</div>`;
  h+=`<button class="restart-btn" onclick="restart()">↺ Retake Quiz</button>`;

  document.getElementById("resultArea").innerHTML=h;
  document.getElementById("resultArea").style.display="block";
  saveData(recs,cleanSelected,wr,loc);
}

function saveData(recs,selectedCourses,wr,loc){
  const streamLabels={science_bio:"Science (PCB/PCMB)",science_math:"Science (PCM)",commerce:"Commerce",humanities:"Humanities"};
  const comfortLabels={stream_love:"Genuinely enjoyed",stream_forced:"Forced/Circumstance",stream_mixed:"Mixed feelings",stream_lost:"No idea/Open"};
  const marksLabels={high:"Above 85%",medium:"70-85%",low:"55-70%",very_low:"Below 55%"};
  const budgetLabels={budget_low:"Under 50k/yr",budget_mid:"50k-2L/yr",budget_high:"2L-5L/yr",budget_premium:"Above 5L/yr"};
  const locationLabels={kerala:"Only Kerala",south:"South India",india:"Anywhere India",abroad:"Open to Abroad"};
  const worryLabels={fees:"Fees/Budget",jobs:"Job prospects",parents:"Parent approval",wrong_choice:"Fear of wrong choice"};
  const courseStatusLabels={yes_course:"Has course in mind",confused:"Confused between options",no_idea:"No idea yet",conflict:"Parent-student conflict"};

  const now=new Date();
  const timestamp=now.toLocaleDateString("en-IN")+", "+now.toLocaleTimeString("en-IN");

  const payload={
    refId:refId,
    time:timestamp,
    name:user.name,
    phone:user.phone,
    location:loc,
    q1:ans[0]||"",
    q2:ans[1]||"",
    q3:ans[2]||"",
    q4:ans[3]||"",
    q5:ans[4]||"",
    stream:streamLabels[ans[5]]||ans[5]||"",
    streamComfort:comfortLabels[ans[6]]||ans[6]||"",
    marks:marksLabels[ans[7]]||ans[7]||"",
    budget:budgetLabels[ans[8]]||ans[8]||"",
    locationPref:locationLabels[ans[9]]||ans[9]||"",
    courseStatus:courseStatusLabels[ans[10]]||ans[10]||"",
    coursesInMind:selectedCourses||"None",
    worry:worryLabels[wr]||wr||"",
    result1:recs[0]?recs[0].n:"",
    result2:recs[1]?recs[1].n:"",
    result3:recs[2]?recs[2].n:""
  };

  fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(()=>{document.getElementById("saveMsg").textContent="✅ Saved. Share Reference ID "+refId+" with your counselor.";})
    .catch(()=>{document.getElementById("saveMsg").textContent="✅ Quiz complete. Reference ID: "+refId;});
}

function restart(){user={name:"",phone:"",state:"Kerala",district:""};ans={};step=0;refId="";renderForm();}
renderForm();
</script>
</body>
</html>
